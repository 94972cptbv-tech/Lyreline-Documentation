site_name: Lyreline Documentation
site_description: User guide, support, privacy, and Safari extension documentation for Lyreline.
site_url: https://94972cptbv-tech.github.io/Lyreline-Documentation/
docs_dir: docs
site_dir: site

theme:
  name: mkdocs

nav:
  - Home: index.md
  - Quick Start: quick-start.md
  - Your First Procedure: your-first-procedure.md
  - User Guide: user-guide.md
  - Capturing Web Pages: capturing-web-pages.md
  - Safari Extension: safari-extension.md
  - Troubleshooting: troubleshooting.md
  - Data Safety: data-safety.md
  - Support: support.md
  - Privacy Policy: privacy.md

markdown_extensions:
  - toc:
      permalink: true

extra_css:
  - stylesheets/feedback.css

extra_javascript:
  - javascripts/feedback.js

strict: true
